# One-click deploy on Render (free web service).
services:
  - type: web
    name: household-spend-tracker
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: DATABASE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      - key: GEMINI_FALLBACK_MODELS
        value: gemini-3.5-flash-lite
      - key: HOUSEHOLD_PASSWORD
        sync: false
      - key: HOUSEHOLD_MEMBERS
        value: Guilherme,Lazia
      - key: SECRET_KEY
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
